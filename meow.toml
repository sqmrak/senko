[target.senkoctl]
slices = ["armv7", "arm64"]
needs = ["openssl-${slice}", "quic"]
output = "build/${slice}/senkoctl"
cflags = ["-std=c99", "-Wall", "-Wextra", "-O2", "-DSENKO_RELEASE", "-fmacro-prefix-map=daemon/=",
          "-Idaemon/core", "-Idaemon/core/third_party", "-Idaemon",
          "-I${OSSL}/include", "-I${QUIC}/include",
          "-Idaemon/lwip_port", "-Idaemon/third_party/lwip/src/include"]
ldflags = ["-Wl,-dead_strip"]
post = [["${TC}/ldid", "-S", "${out}"]]
[target.senkoctl.per_slice.armv7]
ldflags = ["-nostartfiles", "${CRT}"]
[target.senkoctl.per_slice.arm64]
cflags = ["-DSENKO_LWIP_PROFILE_LARGE", "-DSENKO_ROOTLESS=1"]
[[target.senkoctl.src]]
files = ["daemon/senkoctl.c", "daemon/core/b64.c"]

# injected libraries, one slice per cpu the tweak loader can hit
[target.senkotlsfix]
slices = ["armv7", "arm64", "arm64e"]
needs = ["mbedtls"]
output = "build/${slice}/senkotlsfix.dylib"
cflags = ["-std=c99", "-Wall", "-Wextra", "-O2", "-fPIC",
          "-fmacro-prefix-map=senkotlsfix/=", "-fmacro-prefix-map=daemon/=../daemon/",
          "-Idaemon", "-I${MBED}/include", "-DMBEDTLS_PLATFORM_MS_TIME_ALT"]
# static mbedtls keeps the dylib free of a device-side dependency
ldflags = ["-dynamiclib", "-Wl,-no_warn_inits", "-install_name", "${INSTALL_NAME}",
           "-framework", "Security", "-framework", "CoreFoundation",
           "${MBED}/lib/libmbedtls-${slice}.a", "${MBED}/lib/libmbedx509-${slice}.a",
           "${MBED}/lib/libmbedcrypto-${slice}.a"]
post = [["${TC}/ldid", "-S", "${out}"]]
[target.senkotlsfix.per_slice.armv7]
vars = { INSTALL_NAME = "/usr/lib/senkotlsfix.dylib" }
[target.senkotlsfix.per_slice.arm64]
cflags = ["-DSENKO_ROOTLESS=1"]
vars = { INSTALL_NAME = "/var/jb/usr/lib/senkotlsfix.dylib" }
[target.senkotlsfix.per_slice.arm64e]
cflags = ["-DSENKO_ROOTLESS=1"]
vars = { INSTALL_NAME = "/var/jb/usr/lib/senkotlsfix.dylib" }
[[target.senkotlsfix.src]]
files = ["senkotlsfix/fishhook.c", "senkotlsfix/stl_gate.c", "senkotlsfix/stl_log.c",
         "senkotlsfix/stl_proxy.c", "senkotlsfix/stl_roots.c", "senkotlsfix/stl_shadow.c",
         "senkotlsfix/stl_trust.c", "senkotlsfix/stl_init.c", "senkotlsfix/ms_time_ios.c",
         "senkotlsfix/builtins.c", "daemon/legacy_ios.c"]

[target.senkostatus]
slices = ["armv7", "arm64", "arm64e"]
output = "build/${slice}/senkostatus.dylib"
cflags = ["-fno-objc-arc", "-Wall", "-Wextra", "-O2", "-fPIC"]
ldflags = ["-dynamiclib", "-Wl,-no_warn_inits", "-install_name", "${INSTALL_NAME}",
           "-framework", "Foundation", "-framework", "UIKit",
           "-framework", "CoreFoundation", "-lobjc"]
post = [["${TC}/ldid", "-S", "${out}"]]
[target.senkostatus.per_slice.armv7]
vars = { INSTALL_NAME = "/usr/lib/senkostatus.dylib" }
[target.senkostatus.per_slice.arm64]
cflags = ["-DSENKO_ROOTLESS=1"]
vars = { INSTALL_NAME = "/var/jb/usr/lib/senkostatus.dylib" }
[target.senkostatus.per_slice.arm64e]
cflags = ["-DSENKO_ROOTLESS=1"]
vars = { INSTALL_NAME = "/var/jb/usr/lib/senkostatus.dylib" }
