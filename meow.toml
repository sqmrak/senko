# make everything outperform without waiting
# by sqmrak :3

# parallel incremental build of the senko binaries, see tools/meow
# the compile graph, the package and its checks live here, the host tests in tests/tests.toml.
# dependency builds (openssl, mbedtls, ngtcp2, senko-core) stay in scripts/, they are prebuilt
# into the shared cache and only run while a result is missing

# `meow build` with no name builds the release package
default = ["release"]

# the host test programs, one table each
include = ["tests/tests.toml"]

[vars]
TC = "${SENKO_TC}"
MBED = "${SENKO_MBED}"
# the release deb lands next to the sources unless SENKO_DEB_DIR names another directory
DEB_DIR = "${SENKO_DEB_DIR:-${root}}"

[slice.armv7]
cc = "${TC}/clang"
ar = "${TC}/llvm-ar"
flags = ["-target", "arm-apple-darwin11", "-B", "${TC}", "-arch", "armv7",
         "-miphoneos-version-min=4.3", "-isysroot", "${SDK}"]
[slice.armv7.vars]
SDK = "${SENKO_SDK_V7}"
OSSL = "${SENKO_OSSL_V7}"
QUIC = "${SENKO_QUIC}/armv7"
CRT = "${SENKO_CRT_V7}"

[slice.arm64]
cc = "${TC}/clang"
ar = "${TC}/llvm-ar"
flags = ["-target", "arm64-apple-darwin", "-B", "${TC}", "-arch", "arm64",
         "-miphoneos-version-min=7.0", "-isysroot", "${SDK}"]
[slice.arm64.vars]
SDK = "${SENKO_SDK_V64}"
OSSL = "${SENKO_OSSL_V64}"
QUIC = "${SENKO_QUIC}/arm64"

# arm64e is only used by the injected libraries, arm64e devices run arm64 executables
[slice.arm64e]
cc = "${TC}/clang"
ar = "${TC}/llvm-ar"
flags = ["-target", "arm64e-apple-darwin", "-B", "${TC}", "-arch", "arm64e",
         "-miphoneos-version-min=12.0", "-isysroot", "${SDK}"]
[slice.arm64e.vars]
SDK = "${SENKO_SDK_VE:-${SENKO_SDK_V64}}"

# vendored zbar builds without warnings
[target.zbar]
slices = ["armv7", "arm64"]
link = "none"
cflags = ["-O2", "-w", "-DSENKO_ZBAR_IOS", "-fmacro-prefix-map=app/=",
          "-Iapp/third_party/zbar/include", "-Iapp/third_party/zbar/zbar",
          "-Iapp/third_party/zbar/zbar/decoder", "-Iapp/third_party/zbar/zbar/qrcode"]
[[target.zbar.src]]
files = [
  "app/third_party/zbar/zbar/config.c",
  "app/third_party/zbar/zbar/error.c",
  "app/third_party/zbar/zbar/symbol.c",
  "app/third_party/zbar/zbar/image.c",
  "app/third_party/zbar/zbar/refcnt.c",
  "app/third_party/zbar/zbar/img_scanner.c",
  "app/third_party/zbar/zbar/scanner.c",
  "app/third_party/zbar/zbar/decoder.c",
  "app/third_party/zbar/zbar/misc.c",
  "app/third_party/zbar/zbar/decoder/qr_finder.c",
  "app/third_party/zbar/zbar/qrcode/qrdec.c",
  "app/third_party/zbar/zbar/qrcode/qrdectxt.c",
  "app/third_party/zbar/zbar/qrcode/rs.c",
  "app/third_party/zbar/zbar/qrcode/isaac.c",
  "app/third_party/zbar/zbar/qrcode/bch15_5.c",
  "app/third_party/zbar/zbar/qrcode/binarize.c",
