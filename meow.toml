[target.app]
slices = ["armv7", "arm64"]
objects_from = ["zbar"]
output = "build/${slice}/senko"
cflags = ["-fno-objc-arc", "-fblocks", "-Wall", "-Wextra", "-O2", "-fmacro-prefix-map=app/=",
          "-Iapp", "-Iapp/theme", "-Iapp/third_party/zbar/include",
          "-Iapp/third_party/zbar/zbar", "-Iapp/third_party/zbar/zbar/decoder",
          "-Iapp/third_party/zbar/zbar/qrcode"]
ldflags = ["-framework", "UIKit", "-framework", "Foundation",
           "-framework", "CFNetwork", "-framework", "CoreText",
           "-framework", "CoreGraphics", "-framework", "QuartzCore",
           "-framework", "AudioToolbox",
           "-weak_framework", "AVFoundation",
           "-weak_framework", "CoreMedia", "-weak_framework", "CoreVideo",
           "-lz", "-liconv"]
[target.app.per_slice.armv7]
# ios 8 draws popovers and action sheets as empty dark boxes in an armv7 binary
# whose sdk field reads 4.3, so the field stays 5.0 while the target is 4.3
