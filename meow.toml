# springboard icons for every slot, cut from the 2x icon. run `meow build icons-home` after
# the artwork changes, the pngs are committed. point the master at a 1024 px file for sharp 3x
# and ipad sizes. Icon@2x.png is the default master and is not written back
[icons.home]
master = "app/icons/Icon@2x.png"
out = "app/icons"

[icons.home.sizes]
"Icon.png" = 57
"Icon-72.png" = 72
"Icon-72@2x.png" = 144
"Icon-60@2x.png" = 120
"Icon-60@3x.png" = 180
"Icon-76.png" = 76
"Icon-76@2x.png" = 152
"Icon-83.5@2x.png" = 167

# ui glyphs, white outlines the app tints at run time. `meow build glyphs-ui` after a source changes
[glyphs.ui]
src = ["app/icons/glyphs/src/*.svg"]
out = "app/icons/glyphs"
prefix = "glyph-"
size = 24
scales = [1, 2, 3]

# one glyph at a time, so a new source does not rewrite the committed pngs of the others
[glyphs.copy]
items = [{ from = "app/icons/glyphs/src/copy.svg", name = "copy" }]
out = "app/icons/glyphs"
prefix = "glyph-"
size = 24
scales = [1, 2, 3]
