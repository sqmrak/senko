[target.lwip]
slices = ["armv7", "arm64"]
needs = ["openssl-${slice}", "quic"]
link = "archive"
output = "build/${slice}/libsenko_lwip.a"
cflags = ["-std=c99", "-Wall", "-Wextra", "-O2", "-DSENKO_RELEASE", "-fmacro-prefix-map=daemon/=",
          "-Idaemon/core", "-Idaemon/core/third_party", "-Idaemon",
          "-I${OSSL}/include", "-I${QUIC}/include",
          "-Idaemon/lwip_port", "-Idaemon/third_party/lwip/src/include"]
[target.lwip.per_slice.arm64]
# lwipopts.h sizes the flow tables by profile, and only 64-bit slices get the large one
cflags = ["-DSENKO_LWIP_PROFILE_LARGE", "-DSENKO_ROOTLESS=1"]
[[target.lwip.src]]
files = [
  "daemon/third_party/lwip/src/core/*.c",
  "daemon/third_party/lwip/src/core/ipv4/*.c",
  "daemon/third_party/lwip/src/core/ipv6/*.c",
  "daemon/lwip_port/lwip_sys.c",
]

[target.senkod]
slices = ["armv7", "arm64"]
needs = ["lwip", "openssl-${slice}", "quic"]
output = "build/${slice}/senkod"
cflags = ["-std=c99", "-Wall", "-Wextra", "-O2", "-DSENKO_RELEASE", "-fmacro-prefix-map=daemon/=",
          "-Idaemon/core", "-Idaemon/core/third_party", "-Idaemon",
          "-I${OSSL}/include", "-I${QUIC}/include",
          "-Idaemon/lwip_port", "-Idaemon/third_party/lwip/src/include"]
# static openssl and quic keep the runtime dependency limited to libsystem, and
# dead_strip drops unreachable archive code so both slices stay small
ldflags = ["-Wl,-dead_strip", "build/${slice}/libsenko_lwip.a",
           "${QUIC}/lib/libngtcp2.a", "${QUIC}/lib/libnghttp3.a",
           "${OSSL}/lib/libssl.a", "${OSSL}/lib/libcrypto.a", "-lz",
           "-framework", "CoreFoundation", "-framework", "SystemConfiguration",
           # a __RESTRICT segment makes dyld ignore DYLD_INSERT_LIBRARIES, so a
           # tweak cannot hook connect() inside the root daemon
           "-Wl,-sectcreate,__RESTRICT,__restrict,/dev/null"]
post = [["${TC}/ldid", "-S", "${out}"]]
[target.senkod.per_slice.armv7]
ldflags = ["-nostartfiles", "${CRT}"]
[target.senkod.per_slice.arm64]
cflags = ["-DSENKO_LWIP_PROFILE_LARGE", "-DSENKO_ROOTLESS=1"]
[[target.senkod.src]]
