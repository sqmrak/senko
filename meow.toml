# universal outputs: lipo, strip local symbols, sign
[fat.senkod-fat]
from = "senkod"
lipo = "${TC}/lipo"
output = "build/fat/senkod"
post = [["${TC}/strip", "-x", "${out}"], ["${TC}/ldid", "-S", "${out}"]]

[fat.senkoctl-fat]
from = "senkoctl"
lipo = "${TC}/lipo"
output = "build/fat/senkoctl"
post = [["${TC}/strip", "-x", "${out}"], ["${TC}/ldid", "-S", "${out}"]]

[fat.senko-fat]
from = "app"
lipo = "${TC}/lipo"
output = "build/fat/senko"
post = [["${TC}/strip", "-x", "${out}"], ["${TC}/ldid", "-Sapp/entitlements.plist", "${out}"]]

[fat.senkotlsfix-fat]
from = "senkotlsfix"
lipo = "${TC}/lipo"
output = "build/fat/senkotlsfix.dylib"
post = [["${TC}/strip", "-x", "${out}"], ["${TC}/ldid", "-S", "${out}"]]

[fat.senkostatus-fat]
from = "senkostatus"
lipo = "${TC}/lipo"
output = "build/fat/senkostatus.dylib"
post = [["${TC}/strip", "-x", "${out}"], ["${TC}/ldid", "-S", "${out}"]]

# dependency builds run only while an output is missing (bootstrap), so a finished
# cache is never touched, build_mbedtls.sh would wipe it first. sources of the
# dependencies are not tracked, delete the marker to force a rebuild
[step.openssl-armv7]
run = [["bash", "scripts/build_openssl_armv7.sh"]]
outputs = ["${SENKO_OSSL_V7}/lib/libssl.a", "${SENKO_OSSL_V7}/lib/libcrypto.a",
           "${SENKO_OSSL_V7}/.senko-ios-min-4.3"]
bootstrap = true

[step.openssl-arm64]
run = [["bash", "scripts/build_openssl_arm64.sh"]]
outputs = ["${SENKO_OSSL_V64}/lib/libssl.a", "${SENKO_OSSL_V64}/lib/libcrypto.a",
           "${SENKO_OSSL_V64}/.senko-asm"]
bootstrap = true

# ngtcp2 needs SSL_set_quic_tls_cbs, which both openssl builds must have by now
[step.quic]
run = [["bash", "scripts/build_quic.sh"]]
needs = ["openssl-armv7", "openssl-arm64"]
outputs = ["${SENKO_QUIC}/armv7/lib/libngtcp2.a", "${SENKO_QUIC}/armv7/lib/libnghttp3.a",
           "${SENKO_QUIC}/arm64/lib/libngtcp2.a", "${SENKO_QUIC}/arm64/lib/libnghttp3.a",
           "${SENKO_QUIC}/.senko-quic"]
keep = true

[step.mbedtls]
run = [["bash", "scripts/build_mbedtls.sh", "${MBED}"]]
outputs = ["${MBED}/.senko-ios-min-4.3",
           "${MBED}/lib/libmbedtls-armv7.a", "${MBED}/lib/libmbedx509-armv7.a",
           "${MBED}/lib/libmbedcrypto-armv7.a",
           "${MBED}/lib/libmbedtls-arm64.a", "${MBED}/lib/libmbedx509-arm64.a",
           "${MBED}/lib/libmbedcrypto-arm64.a",
           "${MBED}/lib/libmbedtls-arm64e.a", "${MBED}/lib/libmbedx509-arm64e.a",
           "${MBED}/lib/libmbedcrypto-arm64e.a"]
bootstrap = true

# the packet tunnel extension is also senko-core, one arm64 go build for the package
[step.native]
run = [["make", "-C", "native", "clean", "all",
        "TC=${TC}", "LDID=${TC}/ldid", "SDK=${SENKO_SDK_V64}",
        "GO=${SENKO_GO}", "SENKO_CORE_SOURCE=${SENKO_CORE_SRC}", "BUILD=${root}/build/native"]]
inputs = ["native/Makefile", "native/*.h", "native/go/*", "native/PacketTunnel/*",
          "scripts/build_native_core.sh", "scripts/ensure_senko_core_distro.sh",
          "scripts/prepare_core_overlay.sh", "scripts/patches/*.patch",
          "daemon/core/control.c", "daemon/core/control.h", "daemon/core/traffic.h",
          "${SENKO_CORE_SRC}/go.mod", "${SENKO_CORE_SRC}/go.sum",
          "${SENKO_CORE_SRC}/**/*.go"]
outputs = ["build/native/SenkoTunnel.appex/SenkoTunnel",
           "build/native/SenkoTunnel.appex/Info.plist"]

# the go tests of the native core, run by the pinned go toolchain
[step.test-native]
run = [["bash", "scripts/test_native_core.sh"]]
inputs = ["native/go/*", "native/tests/*", "scripts/test_native_core.sh", "scripts/prepare_core_overlay.sh",
          "scripts/patches/*.patch", "${SENKO_CORE_SRC}/go.mod", "${SENKO_CORE_SRC}/**/*.go"]
stamp = "build/stamps/test-native"
env = { SENKO_GO = "${SENKO_GO}", SENKO_CORE_SRC = "${SENKO_CORE_SRC}" }

# the three files that name the version must agree, the control file is the source
[step.version]
run = [["${MEOW}", "check-version", "--expect", "${field:packaging/DEBIAN/control:Version}",
        "--plist", "app/Info.plist", "CFBundleShortVersionString",
        "--field", "app/app_common.h", "SENKO_VERSION"]]
stamp = "build/stamps/version"

# release checks on every binary that goes into the package
[verify.check-senko]
file = "build/fat/senko"
slices = ["armv7", "arm64"]
min_ios = "4.3"
signed = true
allow_dylibs = ["/usr/lib/", "/System/Library/Frameworks/"]

[verify.check-senkod]
file = "build/fat/senkod"
slices = ["armv7", "arm64"]
min_ios = "4.3"
signed = true
allow_dylibs = ["/usr/lib/", "/System/Library/Frameworks/"]

[verify.check-senkoctl]
file = "build/fat/senkoctl"
slices = ["armv7", "arm64"]
min_ios = "4.3"
signed = true
allow_dylibs = ["/usr/lib/", "/System/Library/Frameworks/"]

# the injected libraries are loaded by name from /var/jb, one slice per cpu the loader can hit
[verify.check-senkotlsfix]
file = "build/fat/senkotlsfix.dylib"
slices = ["armv7", "arm64", "arm64e"]
min_ios = "4.3"
signed = true
allow_dylibs = ["/usr/lib/", "/System/Library/Frameworks/", "/var/jb/usr/lib/senkotlsfix.dylib"]

[verify.check-senkostatus]
file = "build/fat/senkostatus.dylib"
slices = ["armv7", "arm64", "arm64e"]
min_ios = "4.3"
signed = true
allow_dylibs = ["/usr/lib/", "/System/Library/Frameworks/", "/var/jb/usr/lib/senkostatus.dylib"]

# the extension is one arm64 executable that carries senko-core
[verify.check-tunnel]
file = "build/native/SenkoTunnel.appex/SenkoTunnel"
slices = ["arm64"]
min_ios = "9.0"
signed = true
require_symbols = ["SenkoNativeRunFile"]
needs = ["native"]

# one universal package, every path under /var/jb except the preferences plist.
# the payload is the same on rootful and rootless systems, postinst links the rootful layout
[deb.release]
output = "${DEB_DIR}/senko-v${field:packaging/DEBIAN/control:Version}.deb"
control = "packaging/DEBIAN/control"
packages = "${DEB_DIR}/senko-v${field:packaging/DEBIAN/control:Version}.Packages"
scripts = { postinst = "packaging/DEBIAN/postinst", postrm = "packaging/DEBIAN/postrm", prerm = "packaging/DEBIAN/prerm" }
needs = ["version", "test", "test-native", "native", "check-senko", "check-senkod", "check-senkoctl",
         "check-senkotlsfix", "check-senkostatus", "check-tunnel"]
forbid_setuid = true
forbid_text = ["@SENKO_"]
require = ["var/jb/usr/lib/senko/cacert.pem", "var/jb/usr/lib/senkotlsfix.dylib", "var/jb/usr/lib/senkostatus.dylib",
           "var/jb/Applications/Senko.app/PlugIns/SenkoTunnel.appex/cacert.pem",
           "var/jb/usr/lib/senko/launchd.sh", "var/jb/Library/LaunchDaemons/com.senko.senkod.plist",
           "DEBIAN/control", "DEBIAN/md5sums"]
require_exec = ["var/jb/Applications/Senko.app/senko", "var/jb/usr/bin/senkod", "var/jb/usr/bin/senkoctl",
                "DEBIAN/postinst", "DEBIAN/postrm", "DEBIAN/prerm"]
# a separate daemon, redsocks, setuid helpers, pf and substrate payloads are gone on purpose,
# and nothing may write into the rootless sealed root
forbid = ["var/jb/usr/bin/*awgd", "var/jb/usr/bin/redsocks-senko", "var/jb/usr/bin/senko-kick",
          "var/jb/etc/pf.os", "var/jb/Library/MobileSubstrate", "Applications", "usr", "Library"]
sh_check = ["var/jb/usr/lib/senko/launchd.sh", "DEBIAN/postinst", "DEBIAN/prerm"]
contains = [
  { file = "DEBIAN/control", text = "Architecture: all" },
  { file = "DEBIAN/control", text = "Depends: firmware (>= 4.3)" },
  { file = "DEBIAN/postinst", text = "/usr/lib/senko/launchd.sh" },
  { file = "DEBIAN/prerm", text = "/usr/lib/senko/launchd.sh" },
  { file = "DEBIAN/postinst", text = "install_rootful_layout" },
  { file = "var/jb/Library/LaunchDaemons/com.senko.senkod.plist", text = "<string>/var/jb/usr/bin/senkod</string>" },
]

